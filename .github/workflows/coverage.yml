name: Coverage

on:
  push:

concurrency:
  # Cancel superseded runs for the same pushed ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-bash-xtrace:
    name: shell coverage (bash-xtrace)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run coverage
        shell: bash
        env:
          COVERAGE_DIR: ${{ runner.temp }}/coverage
          ZXFER_COVERAGE_MODE: bash-xtrace
        run: |
          set -euo pipefail
          ./tests/run_coverage.sh
      - name: Summarize bash-xtrace coverage
        if: always()
        shell: bash
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          SUMMARY_FILE: ${{ runner.temp }}/coverage/bash-xtrace/summary.tsv
        run: |
          set -euo pipefail
          {
            echo "## Bash-Xtrace Coverage (report-only)"
            echo
            echo "Commit: \`$GIT_SHA\`"
            echo
            echo "Ref: \`$GIT_REF\`"
            echo
            if [ -f "$SUMMARY_FILE" ]; then
              echo "| target | pct | coverable | hit | miss |"
              echo "| --- | ---: | ---: | ---: | ---: |"
              awk -F '\t' '
                NF >= 5 {
                  printf "| `%s` | %s%% | %s | %s | %s |\n", $5, $1, $2, $3, $4
                }
              ' "$SUMMARY_FILE"
            else
              echo "Coverage summary was not generated."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zxfer-coverage-bash-xtrace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage
          if-no-files-found: warn

  coverage-kcov:
    name: shell coverage (kcov)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run coverage with kcov
        continue-on-error: true
        shell: bash
        env:
          COVERAGE_DIR: ${{ runner.temp }}/coverage-kcov
          ZXFER_COVERAGE_MODE: kcov
        run: |
          set -euo pipefail
          mkdir -p "$COVERAGE_DIR"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e COVERAGE_DIR=/tmp/zxfer-coverage \
            -e ZXFER_COVERAGE_MODE="$ZXFER_COVERAGE_MODE" \
            -v "$PWD:$PWD" \
            -v "$COVERAGE_DIR:/tmp/zxfer-coverage" \
            -w "$PWD" \
            kcov/kcov@sha256:481289ae32e55e5b733019515acd10948a4f76dfed381765577db909664fc603 \
            sh -lc './tests/run_coverage.sh tests/test_zxfer_*.sh'
      - name: Upload kcov artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zxfer-coverage-kcov-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-kcov
          if-no-files-found: ignore
