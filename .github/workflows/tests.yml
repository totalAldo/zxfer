# Keep Linux and portable-shell shunit2 runs at the documented four-worker
# validation bound. macOS runs serially because several suites intentionally
# exercise process groups, signals, FIFOs, and nested runners, and nesting them
# under a parallel worker can strand shell-level waits. VM-backed platform jobs
# use two workers to match their smaller guest CPU allocation. The tool
# self-tests (tests/test_run_*.sh, test_validate.sh, test_ci_*.sh and
# test_generate_solaris_manpage.sh) run on ubuntu-26.04 and macos-26 only;
# every other lane passes --skip-tool-suites.
name: Unit Tests

on:
  push:

concurrency:
  # Cancel superseded runs for the same pushed ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shunit2:
    name: shunit2 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            unit_jobs: 4
            unit_flags: ""
          - os: macos-26
            unit_jobs: 1
            unit_flags: ""
          # GitHub has no macos-27 label yet; the xcode-27 preview image is
          # the hosted macOS 27 runner (macOS 27.0 base, bash 3.2 /bin/sh).
          - os: xcode-27
            unit_jobs: 1
            unit_flags: --skip-tool-suites
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shunit2 tests
        shell: bash
        run: |
          set -euo pipefail
          # This unit matrix intentionally does not install ZFS on macOS.
          # The shunit2 suites are used here as a /bin/sh and BSD-userland
          # portability gate without requiring a live ZFS stack.
          ./tests/run_shunit_tests.sh --jobs "${{ matrix.unit_jobs }}" ${{ matrix.unit_flags }}

  portable-shells:
    name: shunit2 (${{ matrix.shell_name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell_name: dash
            shell_kind: dash
          - shell_name: bash --posix
            shell_kind: bash-posix
          - shell_name: busybox ash
            shell_kind: busybox-ash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install portable shells
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y busybox
      - name: Resolve shell under test
        id: shell_under_test
        shell: bash
        run: |
          set -euo pipefail
          wrapper_dir="$RUNNER_TEMP/zxfer-test-shells"
          mkdir -p "$wrapper_dir"
          case "${{ matrix.shell_kind }}" in
            dash)
              shell_under_test="$(command -v dash)"
              ;;
            bash-posix)
              bash_bin="$(command -v bash)"
              shell_under_test="$wrapper_dir/bash-posix"
              printf '%s\n' '#!/bin/sh' \
                "exec \"$bash_bin\" --posix \"\$@\"" >"$shell_under_test"
              chmod 755 "$shell_under_test"
              ;;
            busybox-ash)
              busybox_bin="$(command -v busybox)"
              shell_under_test="$wrapper_dir/busybox-ash"
              printf '%s\n' '#!/bin/sh' \
                "exec \"$busybox_bin\" ash \"\$@\"" >"$shell_under_test"
              chmod 755 "$shell_under_test"
              ;;
            *)
              echo "Unknown shell kind: ${{ matrix.shell_kind }}" >&2
              exit 1
              ;;
          esac
          printf 'shell_under_test=%s\n' "$shell_under_test" >>"$GITHUB_OUTPUT"
          printf 'Using shell under test: %s\n' "$shell_under_test"
      - name: Run shunit2 tests under selected shell
        shell: bash
        env:
          ZXFER_TEST_SHELL: ${{ steps.shell_under_test.outputs.shell_under_test }}
        run: |
          set -euo pipefail
          ./tests/run_shunit_tests.sh --jobs 4 --skip-tool-suites

  shunit2-freebsd:
    name: shunit2 (FreeBSD)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shunit2 tests on FreeBSD
        uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3 # v1.5.7
        with:
          release: "15.1"
          usesh: true
          prepare: |
            pkg install -y bash git
          run: |
            ./tests/run_shunit_tests.sh --jobs 2 --skip-tool-suites

  shunit2-omnios:
    name: shunit2 (OmniOS)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shunit2 tests on OmniOS
        uses: vmactions/omnios-vm@317e4f8069dad8a65e1520808f1a68ef3fd20565 # v1.3.6
        with:
          release: "r151058"
          usesh: true
          prepare: |
            PKG_SUCCESS_ON_NOP=1 pkg install bash git
          run: |
            bash_bin=$(command -v bash)
            wrapper=$(mktemp /tmp/zxfer-bash-posix.XXXXXX)
            printf '%s\n' '#!/bin/sh' "exec \"$bash_bin\" --posix \"\$@\"" >"$wrapper"
            chmod 755 "$wrapper"
            export ZXFER_TEST_SHELL="$wrapper"
            # OmniOS /usr/xpg4/bin/sh follows ksh-style subshell function-binding
            # semantics and does not honor the subshell helper overrides used by
            # the shunit suites. Keep OmniOS runtime coverage in the integration
            # job, but run the unit suites through a POSIX bash wrapper here so
            # the tests exercise zxfer logic rather than shell-specific stubbing
            # behavior.
            "$bash_bin" ./tests/run_shunit_tests.sh --jobs 2 --skip-tool-suites

  argv-fuzz:
    name: argv fuzz (seeded)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the seeded argv-boundary fuzz
        shell: bash
        run: |
          set -euo pipefail
          # The fuzz runs the real ./zxfer against its own fake zfs, mock ssh
          # and mock parallel, so it needs nothing installed. The run number
          # is the seed: a failure prints the command that reproduces it.
          # Name the awk, since the fake zfs and the checker run under it.
          awk -W version </dev/null 2>&1 | sed -n '1p' || :
          ./tests/run_argv_fuzz.sh --seed "$GITHUB_RUN_NUMBER" --iterations 200
