name: Lint

on:
  push:

concurrency:
  # Cancel superseded runs for the same pushed ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - actionlint
          - checkbashisms
          - shfmt
          - codespell
          - shellcheck
          - budget
          - manpages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run lint target
        shell: bash
        env:
          ZXFER_LINT_TOOL_DIR: ${{ runner.temp }}/zxfer-lint-tools
        run: |
          set -euo pipefail
          ./tests/run_lint.sh "${{ matrix.target }}"
